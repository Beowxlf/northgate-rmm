name: G2B release-candidate trust qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2b-release-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Release-candidate trust qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COSIGN_VERSION: 3.1.3
      SYFT_VERSION: 1.51.1
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install checksum-verified release tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          tools="$RUNNER_TEMP/g2b-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  $RUNNER_TEMP/syft.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$tools" syft
          curl --fail --location --silent --show-error \
            --output "$tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $tools/cosign" \
            | sha256sum --check --strict
          chmod 0755 "$tools/syft" "$tools/cosign"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Build and qualify a non-published release candidate
        working-directory: agent
        run: |
          set -euo pipefail
          version=0.2.0
          commit="$(git rev-parse HEAD)"
          expected_invocation="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          signing_directory="$(mktemp -d)"
          verification_directory="$(mktemp -d)"
          cleanup() {
            rm -rf -- "$signing_directory" "$verification_directory"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0700 "$verification_directory"
          spdx_schema="$verification_directory/spdx-2.3-schema.json"
          curl --fail --location --silent --show-error \
            --output "$spdx_schema" \
            https://raw.githubusercontent.com/spdx/spdx-spec/aadf3b0b8dbbabdb4d880b0fc714255fea436ff7/schemas/spdx-schema.json
          echo "239208b7ac287b3cf5d9a9af23f9d69863971102a5e1587a27a398b43490b89b  $spdx_schema" \
            | sha256sum --check --strict
          COSIGN_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export COSIGN_PASSWORD
          (
            cd "$signing_directory"
            cosign generate-key-pair >/dev/null
          )
          expected_key_sha256="$(sha256sum "$signing_directory/cosign.pub" | cut -d ' ' -f 1)"
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin g2b-builder
          builder_home="$signing_directory/home"
          mkdir "$builder_home"
          sudo chown g2b-builder "$builder_home"
          chmod 0755 "$signing_directory"
          chmod 0444 "$signing_directory/cosign.key" "$signing_directory/cosign.pub"
          chmod 0755 packaging/build-deb.sh
          chmod 0555 \
            packaging/release/create-candidate.sh \
            packaging/release/test-candidate.sh \
            packaging/release/verify-candidate.py \
            "$GITHUB_WORKSPACE/scripts/validate-spdx.mjs"
          mkdir -p build/g2b/package-a build/g2b/package-b build/g2b/candidate
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -buildvcs=false -ldflags='-buildid= -X main.version=0.2.0' \
            -o build/g2b/northgate-rmm-agent ./cmd/northgate-rmm-agent
          packaging/build-deb.sh \
            "$version" build/g2b/northgate-rmm-agent build/g2b/package-a
          packaging/build-deb.sh \
            "$version" build/g2b/northgate-rmm-agent build/g2b/package-b
          cmp \
            build/g2b/package-a/northgate-rmm-agent_0.2.0_amd64.deb \
            build/g2b/package-b/northgate-rmm-agent_0.2.0_amd64.deb
          sudo chown g2b-builder build/g2b/candidate
          test ! -w packaging/release/verify-candidate.py
          sudo --preserve-env=COSIGN_PASSWORD -u g2b-builder -- \
            env \
            HOME="$builder_home" \
            "$GITHUB_WORKSPACE/agent/packaging/release/create-candidate.sh" \
            build/g2b/package-a/northgate-rmm-agent_0.2.0_amd64.deb \
            build/g2b/candidate \
            "$version" \
            "$commit" \
            "$SOURCE_DATE_EPOCH" \
            "https://github.com/Beowxlf/northgate-rmm/.github/workflows/g2b-release-trust.yml" \
            "$expected_invocation" \
            "$signing_directory/cosign.key" \
            "$signing_directory/cosign.pub"
          if sudo -u g2b-builder -- test -w packaging/release/verify-candidate.py; then
            echo "candidate generator can write the protected verifier" >&2
            exit 71
          fi
          packaging/release/test-candidate.sh \
            build/g2b/candidate \
            "$commit" \
            "$version" \
            "$expected_key_sha256" \
            "$expected_invocation" \
            "$verification_directory/qualification-result.json" \
            "$spdx_schema" \
            "$GITHUB_WORKSPACE/scripts/validate-spdx.mjs"
          test ! -e build/g2b/candidate/cosign.key
          rm -rf -- "$signing_directory"
          unset COSIGN_PASSWORD
          test ! -e "$signing_directory"
          {
            echo '## G2B release-candidate trust qualification'
            echo
            echo 'Test-only signing material was destroyed; nothing was published.'
            echo
            echo '```json'
            cat "$verification_directory/qualification-result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cleanup
          trap - EXIT HUP INT TERM
