name: Repository security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 3"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Free-software security checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/northgate_rmm_test
      GOTOOLCHAIN: local
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
        env:
          POSTGRES_DB: northgate_rmm_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d northgate_rmm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false
      - name: Audit locked npm dependencies
        id: npm-audit
        continue-on-error: true
        run: |
          npm ci --ignore-scripts --no-audit
          node --test scripts/classify-npm-audit-result.test.mjs
          audit_status=1
          for attempt in 1 2 3; do
            audit_result="$RUNNER_TEMP/npm-audit-$attempt.json"
            if npm audit \
              --json \
              --audit-level=high \
              --fetch-retries=0 \
              --fetch-timeout=60000 > "$audit_result"; then
              cat "$audit_result"
              audit_status=0
              break
            else
              audit_status=$?
              cat "$audit_result"
              if ! node scripts/classify-npm-audit-result.mjs "$audit_result"; then
                exit "$audit_status"
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "npm advisory audit attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          exit "$audit_status"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: ""
      - name: Install pinned Python audit tools
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install zizmor==1.29.0 semgrep==1.175.0 pip-audit==2.10.1
          python -m pip install --requirement requirements-dev.txt
      - name: Audit Python tool dependencies
        run: pip-audit --progress-spinner off
      - name: Check Phase 1 Python quality and types
        run: |
          ruff format --check src tests server/packaging/launcher.py
          ruff check src tests server/packaging/launcher.py
          mypy src tests server/packaging/launcher.py
      - name: Test Phase 1 Python domain slice
        run: >-
          pytest
          --cov=northgate_rmm
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Scan Phase 1 Python with Bandit
        run: >-
          bandit --recursive src server/packaging/launcher.py
          --severity-level medium
      - name: Check Phase 2 Go agent
        working-directory: agent
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go test -run=^$ -fuzz=FuzzDecode -fuzztime=5s ./config
          go test -run=^$ -fuzz=FuzzParseOSRelease -fuzztime=5s ./collector
          go test -run=^$ -fuzz=FuzzDecodeBundle -fuzztime=5s ./identity
          go test -run=^$ -fuzz=FuzzDecodeState -fuzztime=5s ./sequence
          go test -run=^$ -fuzz=FuzzEmit -fuzztime=5s ./eventlog
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Build and test the Phase 2 Debian package in isolation
        working-directory: agent
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          chmod 0755 packaging/build-deb.sh packaging/debian/test-package.sh
          mkdir -p build/package-a build/package-b
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -buildvcs=false -ldflags='-buildid= -X main.version=0.2.0' \
            -o build/northgate-rmm-agent ./cmd/northgate-rmm-agent
          packaging/build-deb.sh 0.2.0 build/northgate-rmm-agent build/package-a
          packaging/build-deb.sh 0.2.0 build/northgate-rmm-agent build/package-b
          cmp \
            build/package-a/northgate-rmm-agent_0.2.0_amd64.deb \
            build/package-b/northgate-rmm-agent_0.2.0_amd64.deb
          sha256sum build/package-a/northgate-rmm-agent_0.2.0_amd64.deb
          docker build --pull=false \
            --file packaging/debian/Dockerfile.test \
            --tag northgate-rmm-debian-package-test:12 .
          docker run --rm --network none \
            --security-opt no-new-privileges \
            --volume "$PWD/build/package-a:/packages:ro" \
            --volume "$PWD/packaging/debian/test-package.sh:/test-package.sh:ro" \
            northgate-rmm-debian-package-test:12 \
            sh /test-package.sh /packages/northgate-rmm-agent_0.2.0_amd64.deb
      - name: Build and test the server Debian package in isolation
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          chmod 0755 \
            server/packaging/build-deb.sh \
            server/packaging/debian/test-package.sh
          mkdir -p \
            build/server/application-a \
            build/server/application-b \
            build/server/runtime \
            build/server/package-a \
            build/server/package-b
          python -m pip wheel \
            --no-cache-dir \
            --no-deps \
            --wheel-dir build/server/application-a \
            .
          python -m pip wheel \
            --no-cache-dir \
            --no-deps \
            --wheel-dir build/server/application-b \
            .
          cmp \
            build/server/application-a/northgate_rmm-0.1.0.dev0-py3-none-any.whl \
            build/server/application-b/northgate_rmm-0.1.0.dev0-py3-none-any.whl
          python -m pip download \
            --require-hashes \
            --only-binary=:all: \
            --platform manylinux_2_17_x86_64 \
            --implementation cp \
            --python-version 311 \
            --abi cp311 \
            --dest build/server/runtime \
            --requirement server/requirements-runtime.txt
          server/packaging/build-deb.sh \
            0.1.0~dev0 \
            build/server/application-a/northgate_rmm-0.1.0.dev0-py3-none-any.whl \
            build/server/runtime \
            build/server/package-a
          server/packaging/build-deb.sh \
            0.1.0~dev0 \
            build/server/application-a/northgate_rmm-0.1.0.dev0-py3-none-any.whl \
            build/server/runtime \
            build/server/package-b
          cmp \
            build/server/package-a/northgate-rmm-server_0.1.0~dev0_amd64.deb \
            build/server/package-b/northgate-rmm-server_0.1.0~dev0_amd64.deb
          sha256sum \
            build/server/package-a/northgate-rmm-server_0.1.0~dev0_amd64.deb
          docker build --pull=false \
            --file server/packaging/debian/Dockerfile.test \
            --tag northgate-rmm-server-package-test:12 .
          docker run --rm --network none \
            --security-opt no-new-privileges \
            --volume "$PWD/build/server/package-a:/packages:ro" \
            --volume "$PWD/agent/build/package-a:/agent-packages:ro" \
            --volume "$PWD/server/packaging/debian/test-package.sh:/test-package.sh:ro" \
            northgate-rmm-server-package-test:12 \
            sh /test-package.sh \
            /packages/northgate-rmm-server_0.1.0~dev0_amd64.deb \
            /agent-packages/northgate-rmm-agent_0.2.0_amd64.deb
      - name: Run Semgrep Community Edition
        run: |
          semgrep scan --config p/javascript --error scripts
          semgrep scan --config p/python --error src tests server/packaging/launcher.py
          semgrep scan --config p/golang --error agent
      - name: Audit workflows with Zizmor
        run: zizmor .github/workflows --pedantic
      - name: Install checksum-verified native audit tools
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/lychee.tar.gz" \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/lychee"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/lychee"
      - name: Scan for secrets with Gitleaks
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir . --redact --no-banner --verbose --config .gitleaks.toml'
      - name: Validate workflows with actionlint
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
      - name: Validate documentation links with Lychee
        run: >-
          "$RUNNER_TEMP/lychee/lychee"
          --no-progress
          --exclude-path node_modules
          --exclude 'github.com/Beowxlf/northgate-rmm/security/advisories/new'
          --accept '200,204,206,429'
          .
      - name: Enforce npm advisory audit result
        if: ${{ always() }}
        env:
          NPM_AUDIT_OUTCOME: ${{ steps.npm-audit.outcome }}
        run: test "$NPM_AUDIT_OUTCOME" = "success"
