# Install within an http{} context; private-interface firewall rules are required.
server {
    listen 443 ssl;
    server_name rmm.internal;
    ssl_certificate /etc/northgate-rmm/tls/browser-chain.pem;
    ssl_certificate_key /etc/northgate-rmm/tls/browser-key.pem;
    ssl_protocols TLSv1.3;
    access_log off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL https://$host$request_uri;
    }
    location = / { return 302 /endpoints; }
    location /endpoints {
        limit_except GET { deny all; }
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $rmm_token $upstream_http_x_auth_request_access_token;
        auth_request_set $rmm_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $rmm_cookie;
        proxy_set_header Authorization "Bearer $rmm_token";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header Cookie "";
        proxy_set_header Host operator.rmm.internal:8445;
        proxy_ssl_server_name on;
        proxy_ssl_name operator.rmm.internal;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/northgate-rmm/tls/server-ca.pem;
        proxy_ssl_protocols TLSv1.3;
        proxy_pass https://127.0.0.1:8445;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / { return 404; }
}
