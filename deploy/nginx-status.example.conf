server {
    listen 443 ssl;
    server_name status.rmm.internal;
    ssl_certificate /etc/northgate-rmm/tls/status-chain.pem;
    ssl_certificate_key /etc/northgate-rmm/tls/status-key.pem;
    ssl_protocols TLSv1.3;
    access_log off;
    root /var/lib/northgate-rmm-status;
    location ~ "^/[0-9a-f]{64}\.json$" {
        limit_except GET { deny all; }
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { return 404; }
}
