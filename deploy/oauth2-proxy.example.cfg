provider = "keycloak-oidc"
http_address = "127.0.0.1:4180"
reverse_proxy = true
oidc_issuer_url = "https://idp.rmm.internal/realms/northgate"
client_id = "northgate-rmm"
client_secret_file = "/run/credentials/northgate-rmm-login.service/client-secret"
cookie_secret_file = "/run/credentials/northgate-rmm-login.service/cookie-secret"
redirect_url = "https://rmm.internal/oauth2/callback"
scope = "openid profile email"
code_challenge_method = "S256"
email_domains = ["*"]
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1m"
set_xauthrequest = true
pass_access_token = true
upstreams = ["static://202"]
request_logging = false
auth_logging = false
standard_logging = true
# Backend online introspection additionally pins exactly one subject, viewer
# role, audience, ACR and AMR; login alone grants no RMM access.
