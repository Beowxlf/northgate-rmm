# Add inside the existing private operator server{} block.
location ~ ^/(remote/|guacamole/) {
    client_max_body_size 21m;
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;
    auth_request_set $remote_token $upstream_http_x_auth_request_access_token;
    auth_request_set $remote_cookie $upstream_http_set_cookie;
    add_header Set-Cookie $remote_cookie;
    add_header Cache-Control "no-store" always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "strict-origin" always;
    proxy_set_header Authorization "Bearer $remote_token";
    proxy_set_header Host operator.rmm.internal;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:8451;
    # Encrypted Guacamole connection tickets can exceed the default 4k header.
    proxy_buffer_size 32k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    client_body_timeout 90s;
    proxy_send_timeout 30s;
    access_log off;
}
