[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northgate-rmm"
version = "0.1.0.dev0"
description = "Private Linux and Windows endpoint monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Beowxlf" }]
dependencies = [
  "aiohttp==3.14.3",
  "cryptography==50.0.1",
  "psycopg[binary]==3.3.4",
]

[project.scripts]
northgate-rmm-issuer-service = "northgate_rmm.issuer_service:main"
northgate-rmm-oidc-service = "northgate_rmm.oidc_bridge:main"
northgate-rmm-audit-service = "northgate_rmm.audit_sink:main"
northgate-rmm-audit-export = "northgate_rmm.audit_exporter:main"
northgate-rmm-audit-reconcile = "northgate_rmm.audit_reconcile:main"
northgate-rmm-certificate-status = "northgate_rmm.certificate_status:main"
northgate-rmm-pki-admin = "northgate_rmm.pki_admin:main"
northgate-rmm-recovery = "northgate_rmm.recovery:main"
northgate-rmm-retention = "northgate_rmm.retention:main"
northgate-rmm-admin = "northgate_rmm.admin:main"
northgate-rmm-agent-service = "northgate_rmm.agent_service:main"
northgate-rmm-enrollment-service = "northgate_rmm.enrollment_service:main"
northgate-rmm-operator-service = "northgate_rmm.operator_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
northgate_rmm = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
markers = ["postgresql: requires the isolated Phase 1 PostgreSQL test service"]

[tool.coverage.run]
branch = true
source = ["northgate_rmm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests"]
